# Reverse proxy for NVIS Software Factory. Used by compose.proxy.yml.
#
# TLS IS TERMINATED TWICE, ON PURPOSE
# -----------------------------------
# nginx terminates on 443 and speaks https to gunicorn rather than http. The startup gate
# requires NVSF_TLS_CERT and NVSF_TLS_KEY to be real files in production, and the escape hatch its
# error message offers -- NVSF_TRUST_PROXY_TLS -- is not implemented anywhere in the application.
# Keeping the upstream hop encrypted also means Flask's request.is_secure stays true, so the app
# still emits Strict-Transport-Security. Over plain http the header silently disappears, and
# bin/verify-deploy.sh reports that only as a warning, which is easy to miss.
#
# No IPv6 listener. A container on a bridge network without IPv6 fails to bind [::] and nginx
# exits rather than degrading, which would take the whole deployment down for an address family
# nothing is using yet.
#
# THE UPSTREAM IS A VARIABLE, NOT AN upstream BLOCK
# -------------------------------------------------
# nginx resolves a hostname in `upstream` once, when the configuration loads, and caches the
# address for the lifetime of the process. `docker compose up -d --build` gives the recreated app
# container a new IP, and nginx would keep proxying to the old one -- 502 on every request until
# someone thinks to restart the proxy too, which is the upgrade step nobody remembers. Resolving
# through Docker's embedded DNS on each request costs nothing here and survives a recreate. It
# also means `nginx -t` passes without the app running, so the configuration can be checked
# before anything is started.

server {
    listen 80;
    server_name _;

    # The only thing port 80 does. Session cookies are issued Secure, so anything served here
    # could not hold a session anyway.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # The same certificate the container reads. One file to renew, not two.
    ssl_certificate     /etc/nvsf/tls/fullchain.pem;
    ssl_certificate_key /etc/nvsf/tls/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # No add_header here. security_headers.py sets CSP, X-Frame-Options, Referrer-Policy and the
    # rest on every response, and nginx would emit a second, competing copy of each.

    client_max_body_size 16m;

    # Docker's embedded DNS server. Fixed address on every user-defined compose network.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        # $request_uri is appended explicitly: once proxy_pass contains a variable, nginx stops
        # appending the matched location URI itself, and every request would arrive at "/".
        set $factory https://factory:8000;
        proxy_pass $factory$request_uri;

        # The certificate is issued for the public DNS name, and this connection dials the
        # container by its compose service name, so verification cannot succeed by construction.
        # The hop never leaves the VM's container network.
        proxy_ssl_verify off;
        proxy_ssl_server_name on;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;

        # Matches NVSF_WEB_TIMEOUT_SEC, which defaults to 300 because the mapping assistant makes
        # a reasoning call inside a request. nginx defaults to 60s, which would cut those off as a
        # 504 while gunicorn was still working -- a failure that looks like the LLM is broken.
        proxy_connect_timeout 15s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # Assessment progress is polled, and buffering would batch the updates into silence.
        proxy_buffering off;
    }
}
