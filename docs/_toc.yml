# The site structure, and the only place it is declared.
#
# sphinx-external-toc rather than per-page toctrees: with `external_toc_exclude_missing: false`
# in conf.py, a page that exists but is listed nowhere is a build failure. That is the check that
# stops a docs site accumulating pages reachable only by search.
#
# The four captioned groups are the Diataxis modes, and they are not a naming convention -- a page
# in the wrong one answers a question the reader was not asking. See https://diataxis.fr/.
root: index

subtrees:
  - caption: Tutorials — learning by doing
    entries:
      - file: tutorials/assess-your-first-repository
        title: Assess your first repository
      - file: tutorials/describe-a-rack-in-nrm
        title: Describe a rack in NRM

